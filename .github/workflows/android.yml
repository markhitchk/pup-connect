name: Pup Connect React Native checks and APKs
on:
  push:
    branches: [main, react-native-migration, hive-network]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pup-connect-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Record dependency audit
        run: npm audit --json > dependency-audit.json || test -s dependency-audit.json
      - name: Run room, messaging, media and UI checks
        run: |
          set -o pipefail
          npm test | tee tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pup-Connect-checks-${{ github.run_number }}
          path: |
            tests.log
            dependency-audit.json
      - name: Install coturn for actual relay verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coturn
      - name: Verify real TURN relay messaging, media and ICE restart over UDP and TCP
        run: node server/test/coturn-runner.mjs | tee turn-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pup-Connect-TURN-${{ github.run_number }}
          path: turn-check.log
          if-no-files-found: ignore
      - run: npx tsc -p server/tsconfig.build.json
      - name: Build standalone signaling container
        run: docker build -f server/Dockerfile -t pup-connect-signaling:test .
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - name: Configure test signing identity
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.PUP_BETA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$BETA_KEYSTORE_BASE64" ]; then
            printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Build debug and bundled beta APKs
        working-directory: android
        env:
          PUP_INVITE_HOST: ${{ vars.PUP_INVITE_HOST }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleBeta --stacktrace --info --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 | tee build.log
      - name: Verify beta APK signature and 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/beta/app-beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/beta/app-beta.apk
      - name: Build release only with existing signing credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PUP_RELEASE_KEYSTORE_BASE64 }}
          PUP_SIGNING_STORE_PASSWORD: ${{ secrets.PUP_RELEASE_STORE_PASSWORD }}
          PUP_SIGNING_ALIAS: ${{ secrets.PUP_RELEASE_KEY_ALIAS }}
          PUP_SIGNING_KEY_PASSWORD: ${{ secrets.PUP_RELEASE_KEY_PASSWORD }}
          PUP_INVITE_HOST: ${{ vars.PUP_INVITE_HOST }}
        working-directory: android
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            export PUP_SIGNING_STORE="$RUNNER_TEMP/pup-release.jks"
            trap 'rm -f "$PUP_SIGNING_STORE"' EXIT
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$PUP_SIGNING_STORE"
            ./gradlew assembleRelease --console=plain
          else
            printf '%s\n' 'Release signing not configured; test-signed beta is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pup-Connect-APK-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/build.log
          if-no-files-found: error
      - name: Enable KVM for emulator smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, navigate, rotate, and switch system theme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pup-Connect-device-smoke-${{ github.run_number }}
          path: android-smoke/
